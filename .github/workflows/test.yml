name: Test

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-unit-test:
    name: Unit Test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.2.0.app/Contents/Developer"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run SourcePackagesParserTests
        shell: bash
        run: |
          xcodebuild test \
            -scheme LicenseList-Package \
            -only-testing:SourcePackagesParserTests \
            -destination "platform=macOS,arch=arm64" \
            -resultBundlePath TestResults/result_bundle | \
            xcbeautify
